# Site settings
title: Schelertech
subtitle: IT Support Blog
email: chris@schelertech.com
description: >-
  Practical guides for helpdesk work, endpoint management, and everyday IT support.
url: "https://blog.schelertech.com"
baseurl: ""
repository: "schelertech/schelertech.github.io"
twitter_username: schelertech
github_username: schelertech
minimal_mistakes_skin: dark
search: true
logo: "/assets/images/bio-photo.jpg"

# Build settings
markdown: kramdown
remote_theme: mmistakes/minimal-mistakes@4.26.2
permalink: /:categories/:title/
paginate: 5
paginate_path: /page:num/
timezone: America/New_York

include:
  - _pages

exclude:
  - Gemfile
  - Gemfile.lock
  - node_modules
  - vendor/bundle/
  - vendor/cache/
  - vendor/gems/
  - vendor/ruby/
  - README.md

plugins:
  - jekyll-paginate
  - jekyll-sitemap
  - jekyll-gist
  - jekyll-feed
  - jemoji
  - jekyll-include-cache
  - jekyll-seo-tag

author:
  name: "Chris Scheler"
  avatar: "/assets/images/bio-photo.jpg"
  bio: "Ops-minded IT support notes for helpdesk techs and the systems they keep running."
  links:
    - label: "Website"
      icon: "fas fa-fw fa-link"
      url: "https://schelertech.com"
    - label: "GitHub"
      icon: "fab fa-fw fa-github"
      url: "https://github.com/schelertech"
    - label: "Twitter"
      icon: "fab fa-fw fa-twitter-square"
      url: "https://twitter.com/schelertech"

footer:
  links:
    - label: "GitHub"
      icon: "fab fa-fw fa-github"
      url: "https://github.com/schelertech"
    - label: "Twitter"
      icon: "fab fa-fw fa-twitter-square"
      url: "https://twitter.com/schelertech"

defaults:
  - scope:
      path: ""
      type: posts
    values:
      layout: single
      author_profile: true
      read_time: true
      comments: false
      share: true
      related: true
  - scope:
      path: "_pages"
      type: pages
    values:
      layout: single
      author_profile: true

category_archive:
  type: liquid
  path: /categories/
tag_archive:
  type: liquid
  path: /tags/
